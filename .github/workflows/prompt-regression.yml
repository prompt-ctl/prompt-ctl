name: Prompt Regression

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  prompt-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Build
        run: go build -o promptctl

      - name: Run Prompt Regression
        if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          # Skip if API key is not available (safeguard for secrets misconfiguration)
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "⏭️  Skipped: ANTHROPIC_API_KEY not configured"
            exit 0
          fi
          ./promptctl experiment review \
            --file=cmd/root.go \
            --models=claude-sonnet-4-5-20250929 \
            --repeat=2 \
            --min-score=50 \
            --strict-json \
            --ci

      - name: Prompt Regression Skipped
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository
        run: echo "⏭️  Skipped for forked PRs (secrets unavailable)"
