# .github/workflows/release.yml
# On tag push: build, release on private repo, copy binaries to public promptctl-releases, push cask to tap.
# So brew install works for everyone while the main repo stays private.

name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      # Build, create release on private repo, generate cask (skip_upload so we push cask later)
      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}

      # Copy release assets to public repo so brew install works without a token
      - name: Publish to public releases repo
        env:
          GH_TOKEN: ${{ secrets.RELEASES_REPO_GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          shopt -s nullglob
          ARTIFACTS=(dist/*.tar.gz dist/*.zip)
          gh release create "$TAG" \
            --repo oleg-koval/promptctl-releases \
            --title "$TAG" \
            --notes "See [promptctl](https://github.com/oleg-koval/promptctl) (private)." \
            "${ARTIFACTS[@]}"
      - name: Remove source code assets from release
        env:
          GH_TOKEN: ${{ secrets.RELEASES_REPO_GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          for name in "Source code (zip)" "Source code (tar.gz)"; do
            gh release delete-asset "$TAG" "$name" --repo oleg-koval/promptctl-releases -y 2>/dev/null || true
          done

      # Push generated cask to tap (cask URL points at promptctl-releases)
      - name: Push cask to tap
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          git clone --depth 1 "https://${GH_TOKEN}@github.com/oleg-koval/homebrew-tap.git" tap
          mkdir -p tap/Casks
          cp dist/homebrew/Casks/promptctl.rb tap/Casks/
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Casks/promptctl.rb
          git diff --staged --quiet || (git commit -m "promptctl ${TAG}" && git push)

  build-mac-app:
    runs-on: macos-14
    needs: release
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check for Mac app script
        id: check
        run: echo "exists=$([ -f scripts/build-mac-app.sh ] && echo 'true' || echo 'false')" >> "$GITHUB_OUTPUT"

      - name: Build Mac app and create DMG
        id: build
        if: steps.check.outputs.exists == 'true'
        run: |
          if [ -f scripts/build-mac-app.sh ]; then
            ./scripts/build-mac-app.sh
            echo "built=true" >> "$GITHUB_OUTPUT"
          else
            echo "scripts/build-mac-app.sh not found, skipping DMG build"
            echo "built=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload DMG to promptctl-releases
        if: steps.build.outputs.built == 'true'
        env:
          GH_TOKEN: ${{ secrets.RELEASES_REPO_GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          gh release upload "$TAG" \
            promptctl-app/promptctl-macos.dmg \
            --repo oleg-koval/promptctl-releases \
            --clobber
