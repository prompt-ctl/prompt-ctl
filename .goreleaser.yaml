# .goreleaser.yaml
# GoReleaser config for promptctl
# Docs: https://goreleaser.com

# yaml-language-server: $schema=https://goreleaser.com/static/schema.json

version: 2

before:
  hooks:
    - go mod tidy

builds:
  - id: promptctl
    main: ./main.go
    binary: promptctl
    env:
      - CGO_ENABLED=0
    # Build for macOS (Intel + Apple Silicon), Linux, and Windows
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm64
    # Inject version info at build time
    ldflags:
      - -s -w
      - -X github.com/oleg-koval/promptctl/cmd.version={{.Version}}

archives:
  - id: promptctl
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else }}{{ .Arch }}{{ end }}

checksum:
  name_template: "checksums.txt"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^ci:"
      - "^chore:"

# Homebrew Cask (brews deprecated in favor of homebrew_casks since v2.10)
homebrew_casks:
  - repository:
      owner: oleg-koval
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    name: promptctl
    homepage: "https://prompt-ctl.com"
    description: "CLI toolkit that transforms raw intent into structured, optimized prompts"
    license: "MIT"
    url:
      verified: "github.com/oleg-koval/promptctl/"
    binaries:
      - promptctl
    # Remove quarantine so unsigned binary runs on macOS
    hooks:
      post:
        install: |
          if OS.mac?
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/promptctl"]
          end
