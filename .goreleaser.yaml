# .goreleaser.yaml
# GoReleaser config for promptctl
# Docs: https://goreleaser.com

# yaml-language-server: $schema=https://goreleaser.com/static/schema.json

version: 2
project_name: promptctl

before:
  hooks:
    - go mod tidy

builds:
  - id: promptctl
    main: ./main.go
    binary: promptctl
    env:
      - CGO_ENABLED=0
    # Build for macOS (Intel + Apple Silicon), Linux, and Windows
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm64
    # Inject version info at build time
    ldflags:
      - -s -w
      - -X github.com/oleg-koval/promptctl/cmd.version={{.Version}}

archives:
  - id: promptctl
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else }}{{ .Arch }}{{ end }}

checksum:
  name_template: "checksums.txt"
  algorithm: sha256

release:
  name_template: "Release {{.Version}}"
  draft: false
  prerelease: auto
  footer: |
    ## Installation

    ### Homebrew
    ```bash
    brew tap oleg-koval/tap
    brew install promptctl
    ```

    ### Direct Download
    Download the binary for your platform above.

    ### From Source
    ```bash
    git clone https://github.com/prompt-ctl/promptctl.git
    cd promptctl
    make build
    ./promptctl --version
    ```

brews:
  - name: promptctl
    repository:
      owner: oleg-koval
      name: homebrew-tap
      branch: main
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    commit_author:
      name: promptctl-bot
      email: bot@prompt-ctl.com
    commit_msg_template: "chore(release): update promptctl formula to {{ .Version }}"
    homepage: https://prompt-ctl.com
    description: CLI toolkit that transforms raw intent into structured, optimized prompts
    license: MIT
    directory: Formula
    install: |
      bin.install "promptctl"
    test: |
      system "#{bin}/promptctl --version"

changelog:
  disable: false
  use: git
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^ci:"
      - "^chore:"
